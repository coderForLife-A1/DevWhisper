[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devwhisper"
version = "2.0.0"
description = "100% Offline, Privacy-First AI Meeting Notes & Task Extractor for Developers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pywhispercpp>=1.5.0",
    "ollama>=0.6.0",
    "pydantic>=2.9.0",
    "PySide6>=6.12.0",
    "PyAudioWPatch>=0.2.12",
    "numpy>=2.0.0",
    "scipy>=1.15.0",
    "psutil>=7.0.0",
    "pywin32>=312",
    "pynput>=1.8.0",
]

[project.scripts]
devwhisper = "devwhisper.app:main"

