<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevWhisper</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
















<body class="bg-gray-900 text-white p-4">
    <h1 class="text-3xl font-bold mb-6">DevWhisper - Local Speech to Text & LLM Processing</h1>
    <input type="file" id="audioFile" accept=".wav, .mp3, .m4a" class="mb-4" />
    <button id="processButton" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Process
        Locally</button>
    <div id="output" class="mt-8">
        <h2>Client Follow-Up Email</h2>
        <textarea id="clientEmail" rows="10" cols="50" class="bg-gray-800 text-white"></textarea>
        <br />
        <h2>Action Items</h2>
        <pre id="actionItems" class="bg-gray-800 text-white p-4 overflow-y-auto"></pre>
    </div>















    <script>



        document.getElementById('processButton').addEventListener('click', async () => {
            const fileInput = document.getElementById('audioFile');
            if (!fileInput.files || fileInput.files.length === 0) {
                alert('Please select an audio file.');
                return;
            }



            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);










            try {
                const response = await fetch('http://127.0.0.1:8000/api/process', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    alert('Error processing audio.');
                    return;
                }
                const data = await response.json();
                document.getElementById('clientEmail').value = data.extraction_result.client_email;
                document.getElementById('actionItems').textContent = JSON.stringify(data.extraction_result.action_items, null, 2);
            } catch (error) {
                console.error(error);
                alert('An error occurred while processing the audio.');
            }

        });
    </script>
</body>

</html>
